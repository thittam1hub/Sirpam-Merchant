  <!--
    Safe fallback locale.

    Headless Chrome (and some embedded webviews) report an empty or malformed
    navigator.language, which makes Flutter's locale parser throw
    "Incorrect locale information provided" before the first frame renders.
    Normalise the value *before* flutter_bootstrap.js runs.
  -->
  <script>
    (function () {
      var FALLBACK = 'en-US';
      var VALID = /^[A-Za-z]{2,3}(-[A-Za-z0-9]{2,8})*$/;
      function ok(value) { return typeof value === 'string' && VALID.test(value); }
      try {
        if (!ok(navigator.language)) {
          Object.defineProperty(navigator, 'language', {
            configurable: true,
            get: function () { return FALLBACK; }
          });
        }
        var langs = navigator.languages;
        if (!Array.isArray(langs) || langs.length === 0 || !langs.every(ok)) {
          Object.defineProperty(navigator, 'languages', {
            configurable: true,
            get: function () { return [FALLBACK]; }
          });
        }
      } catch (e) {
        console.warn('[vendoros] locale fallback could not be installed', e);
      }
    })();
  </script>

  <style>
    html, body { height: 100%; margin: 0; background: #e8edf5; }
    @media (prefers-color-scheme: dark) {
      html, body { background: #121212; }
    }
  </style>
  <!-- <model-viewer> runtime for the AR/3D stages (model_viewer_plus) -->
  <script type="module" src="./assets/packages/model_viewer_plus/assets/model-viewer.min.js" defer></script>
</head>

  <script src="flutter_bootstrap.js" async></script>
</body>
